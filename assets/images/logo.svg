<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" class="h-10 w-auto">
  <!-- Brand Icon Badge -->
  <g transform="translate(4, 4)">
    <!-- Base Rounded Shield / Square -->
    <rect width="56" height="56" rx="14" fill="#0B3765" />
    <rect x="1" y="1" width="54" height="54" rx="13" stroke="#F9B900" stroke-width="1.5" stroke-opacity="0.35" />
    
    <!-- Globe Meridians / Flight Path -->
    <circle cx="28" cy="28" r="20" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="2 3" />
    
    <!-- Compass / Flight Arc in Gold -->
    <path d="M16 34 C20 22, 36 20, 42 22" stroke="#F9B900" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="42,22 36,20 38,26" fill="#F9B900" />
    
    <!-- Graduation Cap Symbol -->
    <path d="M28 17 L40 23 L28 29 L16 23 Z" fill="#F9B900" />
    <path d="M21 26 V32 C21 34.5 28 36.5 28 36.5 C28 36.5 35 34.5 35 32 V26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M38 23.5 V30" stroke="#F9B900" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="38" cy="30.5" r="1" fill="#F9B900" />
  </g>

  <!-- Typography -->
  <!-- IFS Acronym -->
  <text x="72" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="900" letter-spacing="-0.02em" fill="#0B3765">
    IFS
  </text>

  <!-- Consultants Wordmark -->
  <text x="122" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" letter-spacing="0.08em" fill="#0B3765">
    CONSULTANTS
  </text>

  <!-- Gold Divider Line -->
  <line x1="72" y1="38" x2="260" y2="38" stroke="#F9B900" stroke-width="2.5" stroke-linecap="round" />

  <!-- Subtitle Tagline -->
  <text x="73" y="52" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.18em" fill="#4B6382">
    STUDY ABROAD CONSULTANCY &bull; ESTD. 1999
  </text>
</svg>
